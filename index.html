<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コーヒー手帳</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#100600;--surface:rgba(255,255,255,.035);--border:#3a1e06;
      --gold:#c8a56a;--gold-dim:#7a5020;--text:#f0e0c8;--text-dim:#6a4020;
      --r:11px;
    }
    body{
      background:var(--bg);color:var(--text);
      font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
      min-height:100vh;padding:14px 12px 24px;
      display:flex;flex-direction:column;align-items:center;gap:12px;
    }
    h1{font-size:1.25rem;color:var(--gold);letter-spacing:.12em}

    /* ── layout ── */
    #layout{
      width:100%;max-width:860px;
      display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:start;
    }
    #left{flex:0 0 262px;display:flex;flex-direction:column;gap:10px}
    #right{flex:1 1 300px;display:flex;flex-direction:column;align-items:center;gap:6px}

    @media(max-width:680px){
      #left{flex:0 0 100%;order:2}
      #right{flex:0 0 100%;order:1}
    }

    /* ── card ── */
    .card{
      background:var(--surface);border:1px solid var(--border);
      border-radius:var(--r);padding:13px;display:flex;flex-direction:column;gap:9px;
    }
    .card-title{font-size:.66rem;color:var(--gold-dim);font-weight:700;letter-spacing:.08em;text-transform:uppercase}

    /* ── form ── */
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .field{display:flex;flex-direction:column;gap:3px}
    .field label{font-size:.66rem;color:var(--text-dim)}
    .field input{
      background:rgba(255,255,255,.05);border:1px solid var(--border);
      border-radius:6px;padding:6px 9px;color:var(--text);
      font-size:.8rem;font-family:inherit;outline:none;transition:border-color .15s;
    }
    .field input:focus{border-color:var(--gold-dim)}
    .field input::placeholder{color:#3a2010}

    /* roast buttons */
    .roast-wrap{display:flex;flex-wrap:wrap;gap:4px}
    .rb{
      background:rgba(255,255,255,.04);border:1px solid var(--border);
      border-radius:20px;padding:4px 10px;font-size:.7rem;color:var(--text-dim);
      cursor:pointer;font-family:inherit;transition:all .14s;
    }
    .rb:hover{border-color:var(--gold-dim);color:var(--text)}
    .rb.on{background:rgba(200,165,106,.22);border-color:var(--gold);color:var(--gold);font-weight:700}

    /* ── flavor chips ── */
    #chips{display:flex;flex-wrap:wrap;gap:5px;min-height:18px}
    #chips-empty{font-size:.73rem;color:var(--text-dim)}
    .chip{
      background:rgba(200,165,106,.18);border:1px solid rgba(200,165,106,.4);
      border-radius:20px;padding:3px 6px 3px 10px;font-size:.7rem;color:var(--gold);
      display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;
      transition:background .13s;
    }
    .chip:hover{background:rgba(200,165,106,.32)}
    .chip .x{font-size:.75rem;color:rgba(200,165,106,.55);line-height:1;transition:color .13s}
    .chip:hover .x{color:var(--gold)}

    /* ── share ── */
    #share-btn{
      background:rgba(200,165,106,.13);border:1px solid var(--gold-dim);
      border-radius:8px;padding:9px;color:var(--gold);font-size:.82rem;
      font-weight:700;cursor:pointer;font-family:inherit;width:100%;
      transition:background .14s;letter-spacing:.04em;
    }
    #share-btn:hover{background:rgba(200,165,106,.25)}
    #share-msg{font-size:.7rem;text-align:center;min-height:15px;color:#6aaa6a}

    /* ── shared-note banner ── */
    #shared-banner{
      display:none;background:rgba(200,165,106,.1);border:1px solid var(--gold-dim);
      border-radius:var(--r);padding:10px 14px;font-size:.78rem;color:var(--gold);
      width:100%;max-width:860px;
    }

    /* ── wheel ── */
    #wheel{width:min(86vw,440px);height:min(86vw,440px)}
    #hint{font-size:.68rem;color:#40200a}

    /* ── tag panel ── */
    #tag-panel{
      display:none;flex-direction:column;gap:8px;
      width:min(86vw,440px);
      background:var(--surface);border:1px solid var(--border);
      border-radius:var(--r);padding:12px;margin-top:4px;
      max-height:220px;overflow-y:auto;
    }
    #tag-panel.show{display:flex}
    #tp-title{font-size:.9rem;font-weight:700}
    .sc-label{font-size:.66rem;color:var(--gold-dim);font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
    .tags{display:flex;flex-wrap:wrap;gap:4px}
    .tag{
      background:rgba(200,165,106,.07);border:1px solid rgba(200,165,106,.17);
      border-radius:20px;padding:4px 10px;font-size:.7rem;color:#a07848;
      cursor:pointer;transition:all .13s;user-select:none;
    }
    .tag:hover{background:rgba(200,165,106,.2);color:var(--text)}
    .tag.on{background:rgba(200,165,106,.45);border-color:var(--gold);color:#1a0800;font-weight:700}
  </style>
</head>
<body>

<h1>☕ コーヒー手帳</h1>

<!-- shared note banner (shows when opening a shared URL) -->
<div id="shared-banner">📤 共有されたノートを表示中</div>

<div id="layout">

  <!-- ── Left col: form + chips + share ── -->
  <div id="left">

    <div class="card">
      <div class="card-title">コーヒー情報</div>
      <div class="field">
        <label>豆の名前</label>
        <input id="f-bean" type="text" placeholder="例: イルガチェフェ G1" oninput="updateSummary()">
      </div>
      <div class="grid2">
        <div class="field">
          <label>産地</label>
          <input id="f-origin" type="text" placeholder="エチオピア" oninput="updateSummary()">
        </div>
        <div class="field">
          <label>農園</label>
          <input id="f-farm" type="text" placeholder="コンガ農協" oninput="updateSummary()">
        </div>
      </div>
      <div class="field">
        <label>店名</label>
        <input id="f-shop" type="text" placeholder="Blue Bottle Coffee" oninput="updateSummary()">
      </div>
      <div class="field">
        <label>焙煎度</label>
        <div class="roast-wrap" id="roast-btns">
          <button class="rb" data-v="ライト">ライト</button>
          <button class="rb" data-v="ミディアム">ミディアム</button>
          <button class="rb" data-v="ダーク">ダーク</button>
          <button class="rb" data-v="エスプレッソ">エスプレッソ</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">選択中のフレーバー</div>
      <div id="chips"><span id="chips-empty">ホイールから選んでください</span></div>
    </div>

    <div class="card">
      <button id="share-btn" onclick="doShare()">🔗 このノートを共有</button>
      <div id="share-msg"></div>
    </div>

  </div><!-- /left -->

  <!-- ── Right col: wheel + tag panel ── -->
  <div id="right">
    <svg id="wheel" viewBox="-230 -230 460 460"></svg>
    <p id="hint">カテゴリーをタップして詳細を選択</p>
    <div id="tag-panel">
      <div id="tp-title"></div>
      <div id="tp-body"></div>
    </div>
  </div>

</div><!-- /layout -->

<script>
/* ─── data ─── */
const DATA = [
  {name:'フルーツ',   color:'#a01010',bright:'#e84040',
   sub:[{name:'ベリー系',  tags:['ブラックベリー','ラズベリー','ブルーベリー','イチゴ']},
        {name:'シトラス',  tags:['グレープフルーツ','オレンジ','レモン','ライム']},
        {name:'ドライフルーツ',tags:['レーズン','プルーン','デーツ']},
        {name:'その他フルーツ',tags:['チェリー','リンゴ','桃','マンゴー','パイナップル']}]},
  {name:'フローラル', color:'#5a1080',bright:'#a040c0',
   sub:[{name:'花',   tags:['ジャスミン','ローズ','カモミール','ラベンダー']},
        {name:'紅茶系',tags:['アールグレイ','ハーブティー','エルダーフラワー']}]},
  {name:'スイート',   color:'#b03000',bright:'#f06030',
   sub:[{name:'キャラメル系',tags:['キャラメル','ブラウンシュガー','黒糖','メープル']},
        {name:'甘み系',     tags:['バニラ','ハチミツ','モラセス']}]},
  {name:'ナッツ\nコア',color:'#4a2a1a',bright:'#8a6050',
   sub:[{name:'ナッツ',  tags:['アーモンド','ヘーゼルナッツ','ピーナッツ','カシュー']},
        {name:'チョコ系',tags:['ミルクチョコ','ダークチョコ','カカオ','ローストナッツ']}]},
  {name:'スパイス',   color:'#c04a00',bright:'#f08020',
   sub:[{name:'ウォームスパイス',tags:['シナモン','クローブ','ナツメグ','アニス']},
        {name:'ホットスパイス', tags:['ブラックペッパー','カルダモン','コリアンダー']}]},
  {name:'ロースト',   color:'#1c1c1c',bright:'#505050',
   sub:[{name:'焙煎',  tags:['スモーキー','アッシー','ダークロースト','煙']},
        {name:'穀物系',tags:['モルト','ライ麦','麦芽']}]},
  {name:'グリーン\n野菜',color:'#1a4a18',bright:'#3a8a36',
   sub:[{name:'グリーン',tags:['草','緑茶','抹茶','青葉']},
        {name:'野菜系', tags:['エンドウ豆','ピーマン','ビート','パセリ']}]},
  {name:'酸味\n発酵', color:'#a06000',bright:'#d09000',
   sub:[{name:'酸の種類',tags:['クエン酸','リンゴ酸','酢酸','乳酸']},
        {name:'発酵系', tags:['ヨーグルト','コンブチャ','ワイン','ウイスキー']}]},
  {name:'アース\nその他',color:'#2a3a44',bright:'#607080',
   sub:[{name:'土/木系',  tags:['土','ウッディ','樽','苔','キノコ']},
        {name:'ミネラル系',tags:['ミネラル','ペトリコール','チョーク']}]},
];
DATA.forEach(c => c.sel = new Set());

/* ─── state ─── */
const SVG_EL = document.getElementById('wheel');
const NS = 'http://www.w3.org/2000/svg';
const N = DATA.length, STEP = 2*Math.PI/N, START = -Math.PI/2, GAP = .028;
const R_IN = 52, R_OUT = 162;
let active = -1, roastVal = '';

/* ─── SVG helpers ─── */
function polar(r,a){return[r*Math.cos(a),r*Math.sin(a)]}
function arcPath(r1,r2,a1,a2){
  const[sx1,sy1]=polar(r1,a1+GAP),[ex1,ey1]=polar(r1,a2-GAP);
  const[sx2,sy2]=polar(r2,a1+GAP),[ex2,ey2]=polar(r2,a2-GAP);
  const lg=(a2-a1)>Math.PI?1:0;
  return`M${sx1},${sy1}L${sx2},${sy2}A${r2},${r2} 0 ${lg} 1 ${ex2},${ey2}L${ex1},${ey1}A${r1},${r1} 0 ${lg} 0 ${sx1},${sy1}Z`;
}
function se(tag,attrs){
  const e=document.createElementNS(NS,tag);
  for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);
  return e;
}
function drawLines(g,lines,cx,cy,mid,fs){
  let rot=mid*180/Math.PI;
  if(Math.cos(mid)<0)rot+=180;
  const lh=fs*1.3;
  lines.forEach((ln,i)=>{
    const dy=(i-(lines.length-1)/2)*lh;
    const t=se('text',{x:0,y:0,'text-anchor':'middle','dominant-baseline':'central',
      fill:'rgba(255,255,255,.92)','font-size':fs,'font-weight':'bold','pointer-events':'none',
      'font-family':"'Hiragino Sans','Yu Gothic','Meiryo',sans-serif",
      transform:`translate(${cx},${cy}) rotate(${rot}) translate(0,${dy})`});
    t.textContent=ln; g.appendChild(t);
  });
}

/* ─── render wheel ─── */
function renderWheel(){
  while(SVG_EL.firstChild)SVG_EL.removeChild(SVG_EL.firstChild);

  const defs=se('defs',{});
  const flt=se('filter',{id:'glow',x:'-25%',y:'-25%',width:'150%',height:'150%'});
  const fg=se('feGaussianBlur',{stdDeviation:'4',result:'blur'});
  const fm=se('feMerge',{});
  fm.appendChild(se('feMergeNode',{in:'blur'}));fm.appendChild(se('feMergeNode',{in:'SourceGraphic'}));
  flt.appendChild(fg);flt.appendChild(fm);defs.appendChild(flt);SVG_EL.appendChild(defs);
  SVG_EL.appendChild(se('circle',{cx:0,cy:0,r:R_OUT+10,fill:'#0a0300'}));

  DATA.forEach((cat,i)=>{
    const a1=START+i*STEP, a2=START+(i+1)*STEP, mid=(a1+a2)/2;
    const isA=i===active, isDim=active>=0&&!isA;
    const rOut=isA?R_OUT+22:R_OUT, rIn=isA?R_IN-7:R_IN;

    const g=se('g',{style:`cursor:pointer;transition:opacity .2s;opacity:${isDim?.28:1}`});
    const p=se('path',{d:arcPath(rIn,rOut,a1,a2),fill:isA?cat.bright:cat.color,
      stroke:'#0a0300','stroke-width':'2.5'});
    if(isA)p.setAttribute('filter','url(#glow)');
    g.appendChild(p);

    /* badge */
    if(cat.sel.size>0){
      const[dx,dy]=polar(R_OUT-12,mid);
      g.appendChild(se('circle',{cx:dx,cy:dy,r:6,fill:'#fff',opacity:'.9'}));
      const dt=se('text',{x:dx,y:dy,'text-anchor':'middle','dominant-baseline':'central',
        fill:'#1a0a00','font-size':'7','font-weight':'bold','pointer-events':'none'});
      dt.textContent=cat.sel.size>9?'9+':String(cat.sel.size); g.appendChild(dt);
    }

    const[tx,ty]=polar((rIn+rOut)/2,mid);
    drawLines(g,cat.name.split('\n'),tx,ty,mid,cat.name.includes('\n')?8.5:10.5);

    g.addEventListener('click',()=>{
      active=active===i?-1:i;
      renderWheel(); renderTagPanel();
    });
    SVG_EL.appendChild(g);
  });

  /* center */
  const cg=se('g',{});
  cg.appendChild(se('circle',{cx:0,cy:0,r:R_IN-6,fill:'#2a0e00',stroke:'#c8a56a','stroke-width':'1.5'}));
  [['☕',-10,18],['FLAVOR',6,7],['WHEEL',16,7]].forEach(([t,y,fs])=>{
    const el=se('text',{x:0,y,'text-anchor':'middle',fill:'#c8a56a','font-size':fs,'pointer-events':'none'});
    el.textContent=t; cg.appendChild(el);
  });
  SVG_EL.appendChild(cg);
}

/* ─── tag panel ─── */
function renderTagPanel(){
  const panel=document.getElementById('tag-panel');
  const title=document.getElementById('tp-title');
  const body=document.getElementById('tp-body');
  if(active<0){panel.classList.remove('show');return;}
  const cat=DATA[active];
  panel.classList.add('show');
  title.textContent=cat.name.replace('\n',' ');
  title.style.color=cat.bright;
  body.innerHTML=cat.sub.map(s=>`
    <div style="margin-bottom:8px">
      <div class="sc-label">${s.name}</div>
      <div class="tags">${s.tags.map(t=>`
        <span class="tag${cat.sel.has(t)?' on':''}" data-tag="${t}" onclick="toggleTag(this)">${t}</span>
      `).join('')}</div>
    </div>`).join('');
}

/* ─── toggle tag ─── */
function toggleTag(el){
  if(active<0)return;
  const tag=el.dataset.tag, cat=DATA[active];
  if(cat.sel.has(tag)){cat.sel.delete(tag);el.classList.remove('on');}
  else{cat.sel.add(tag);el.classList.add('on');}
  renderChips(); renderWheel();
}

/* ─── chips ─── */
function renderChips(){
  const wrap=document.getElementById('chips');
  const all=DATA.flatMap((c,ci)=>[...c.sel].map(t=>({tag:t,ci})));
  if(all.length===0){
    wrap.innerHTML='<span id="chips-empty">ホイールから選んでください</span>';
    return;
  }
  wrap.innerHTML=all.map(({tag,ci})=>{
    const cat=DATA[ci];
    return`<span class="chip" style="border-color:${cat.bright}44;color:${cat.bright}"
      onclick="removeChip('${tag}',${ci})">
      ${tag}<span class="x">✕</span>
    </span>`;
  }).join('');
}

function removeChip(tag,ci){
  const cat=DATA[ci];
  if(!cat)return;
  cat.sel.delete(tag);
  renderChips(); renderWheel();
  if(active>=0&&DATA[active]===cat)renderTagPanel();
}

/* ─── roast buttons ─── */
document.getElementById('roast-btns').addEventListener('click',e=>{
  const btn=e.target.closest('.rb'); if(!btn)return;
  const v=btn.dataset.v;
  roastVal=roastVal===v?'':v;
  document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('on',b.dataset.v===roastVal));
  updateSummary();
});

function updateSummary(){/* placeholder for future summary line */}

/* ─── share ─── */
function buildNote(){
  return{
    bean:document.getElementById('f-bean').value,
    origin:document.getElementById('f-origin').value,
    farm:document.getElementById('f-farm').value,
    shop:document.getElementById('f-shop').value,
    roast:roastVal,
    flavors:DATA.flatMap(c=>[...c.sel]),
  };
}

function doShare(){
  const note=buildNote();
  const encoded=btoa(encodeURIComponent(JSON.stringify(note)));
  const url=`${location.origin}${location.pathname}?d=${encoded}`;
  navigator.clipboard.writeText(url).then(()=>{
    const msg=document.getElementById('share-msg');
    msg.textContent='✓ URLをクリップボードにコピーしました';
    setTimeout(()=>msg.textContent='',3000);
  }).catch(()=>{
    /* fallback: select text in prompt */
    prompt('このURLをコピーしてください:',url);
  });
}

/* ─── load from URL ─── */
function loadFromURL(){
  const params=new URLSearchParams(location.search);
  const d=params.get('d'); if(!d)return;
  try{
    const note=JSON.parse(decodeURIComponent(atob(d)));
    document.getElementById('f-bean').value=note.bean||'';
    document.getElementById('f-origin').value=note.origin||'';
    document.getElementById('f-farm').value=note.farm||'';
    document.getElementById('f-shop').value=note.shop||'';
    if(note.roast){
      roastVal=note.roast;
      document.querySelectorAll('.rb').forEach(b=>b.classList.toggle('on',b.dataset.v===roastVal));
    }
    (note.flavors||[]).forEach(tag=>{
      DATA.forEach(cat=>{
        cat.sub.forEach(s=>{if(s.tags.includes(tag))cat.sel.add(tag);});
      });
    });
    document.getElementById('shared-banner').style.display='block';
  }catch(e){console.warn('URL decode failed',e);}
}

/* ─── init ─── */
loadFromURL();
renderWheel();
renderChips();
</script>
</body>
</html>
