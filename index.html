<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コーヒー フレーバーホイール</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #120700;
      color: #f5e6d3;
      font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      gap: 14px;
    }

    h1 {
      font-size: 1.35rem;
      color: #c8a56a;
      letter-spacing: 0.12em;
    }

    #main {
      display: flex;
      gap: 22px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }

    #wheel-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #hint { font-size: 0.72rem; color: #5a3a1a; }

    /* ── Info panel ── */
    #panel {
      background: rgba(255,255,255,0.025);
      border: 1px solid #3e2008;
      border-radius: 14px;
      padding: 18px;
      width: 248px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #panel-title {
      font-size: 1rem;
      font-weight: bold;
      color: #c8a56a;
      padding-bottom: 10px;
      border-bottom: 1px solid #3e2008;
      min-height: 26px;
      transition: color 0.2s;
    }

    .subcat { display: flex; flex-direction: column; gap: 5px; }

    .subcat-label {
      font-size: 0.68rem;
      color: #8b6030;
      font-weight: bold;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .tags { display: flex; flex-wrap: wrap; gap: 4px; }

    .tag {
      background: rgba(200,165,106,0.08);
      border: 1px solid rgba(200,165,106,0.18);
      border-radius: 20px;
      padding: 3px 9px;
      font-size: 0.7rem;
      color: #b89060;
      cursor: pointer;
      transition: all 0.14s;
      user-select: none;
    }
    .tag:hover { background: rgba(200,165,106,0.22); border-color: rgba(200,165,106,0.45); color: #e0c090; }
    .tag.on {
      background: rgba(200,165,106,0.48);
      border-color: #c8a56a;
      color: #1a0a00;
      font-weight: bold;
    }

    #empty-msg {
      font-size: 0.78rem;
      color: #5a3a1a;
      line-height: 1.7;
    }

    /* ── Notes summary ── */
    #notes-section {
      border-top: 1px solid #3e2008;
      padding-top: 11px;
      display: none;
      flex-direction: column;
      gap: 7px;
    }

    #notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #notes-label { font-size: 0.68rem; color: #8b6030; font-weight: bold; letter-spacing: 0.07em; }

    #clear-btn {
      font-size: 0.65rem;
      color: #5a3a1a;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      text-decoration: underline;
      font-family: inherit;
    }
    #clear-btn:hover { color: #c8a56a; }

    #notes-list { display: flex; flex-wrap: wrap; gap: 4px; }

    .note-chip {
      background: rgba(200,165,106,0.12);
      border: 1px solid rgba(200,165,106,0.28);
      border-radius: 20px;
      padding: 2px 8px;
      font-size: 0.67rem;
      color: #c4a07a;
    }
  </style>
</head>
<body>
  <h1>☕ コーヒー フレーバーホイール</h1>

  <div id="main">
    <div id="wheel-wrap">
      <svg id="wheel" width="460" height="460" viewBox="-230 -230 460 460"></svg>
      <p id="hint">セグメントをクリックして探索 · タグでノートを記録</p>
    </div>

    <div id="panel">
      <div id="panel-title">カテゴリーを選択</div>
      <div id="panel-body">
        <p id="empty-msg">ホイールのセグメントをクリックすると、詳細なフレーバーノートが表示されます。<br><br>タグをクリックしてテイスティングノートを記録できます。</p>
      </div>
      <div id="notes-section">
        <div id="notes-header">
          <span id="notes-label">📝 選択中のノート</span>
          <button id="clear-btn" onclick="clearAll()">クリア</button>
        </div>
        <div id="notes-list"></div>
      </div>
    </div>
  </div>

  <script>
    const DATA = [
      {
        name: 'フルーツ', color: '#a01010', bright: '#e84040',
        sub: [
          { name: 'ベリー系', tags: ['ブラックベリー', 'ラズベリー', 'ブルーベリー', 'イチゴ'] },
          { name: 'シトラス', tags: ['グレープフルーツ', 'オレンジ', 'レモン', 'ライム'] },
          { name: 'ドライフルーツ', tags: ['レーズン', 'プルーン', 'デーツ'] },
          { name: 'その他フルーツ', tags: ['チェリー', 'リンゴ', '桃', 'マンゴー', 'パイナップル'] },
        ]
      },
      {
        name: 'フローラル', color: '#5a1080', bright: '#a040c0',
        sub: [
          { name: '花', tags: ['ジャスミン', 'ローズ', 'カモミール', 'ラベンダー'] },
          { name: '紅茶系', tags: ['アールグレイ', 'ハーブティー', 'エルダーフラワー'] },
        ]
      },
      {
        name: 'スイート', color: '#b03000', bright: '#f06030',
        sub: [
          { name: 'キャラメル系', tags: ['キャラメル', 'ブラウンシュガー', '黒糖', 'メープル'] },
          { name: '甘み系', tags: ['バニラ', 'ハチミツ', 'モラセス'] },
        ]
      },
      {
        name: 'ナッツ\nコア', color: '#4a2a1a', bright: '#8a6050',
        sub: [
          { name: 'ナッツ', tags: ['アーモンド', 'ヘーゼルナッツ', 'ピーナッツ', 'カシュー'] },
          { name: 'チョコ系', tags: ['ミルクチョコ', 'ダークチョコ', 'カカオ', 'ローストナッツ'] },
        ]
      },
      {
        name: 'スパイス', color: '#c04a00', bright: '#f08020',
        sub: [
          { name: 'ウォームスパイス', tags: ['シナモン', 'クローブ', 'ナツメグ', 'アニス'] },
          { name: 'ホットスパイス', tags: ['ブラックペッパー', 'カルダモン', 'コリアンダー'] },
        ]
      },
      {
        name: 'ロースト', color: '#1c1c1c', bright: '#505050',
        sub: [
          { name: '焙煎', tags: ['スモーキー', 'アッシー', 'ダークロースト', '煙'] },
          { name: '穀物系', tags: ['モルト', 'ライ麦', '麦芽'] },
        ]
      },
      {
        name: 'グリーン\n野菜', color: '#1a4a18', bright: '#3a8a36',
        sub: [
          { name: 'グリーン', tags: ['草', '緑茶', '抹茶', '青葉'] },
          { name: '野菜系', tags: ['エンドウ豆', 'ピーマン', 'ビート', 'パセリ'] },
        ]
      },
      {
        name: '酸味\n発酵', color: '#a06000', bright: '#d09000',
        sub: [
          { name: '酸の種類', tags: ['クエン酸', 'リンゴ酸', '酢酸', '乳酸'] },
          { name: '発酵系', tags: ['ヨーグルト', 'コンブチャ', 'ワイン', 'ウイスキー'] },
        ]
      },
      {
        name: 'アース\nその他', color: '#2a3a44', bright: '#607080',
        sub: [
          { name: '土/木系', tags: ['土', 'ウッディ', '樽', '苔', 'キノコ'] },
          { name: 'ミネラル系', tags: ['ミネラル', 'ペトリコール', 'チョーク'] },
        ]
      },
    ];

    DATA.forEach(cat => { cat.sel = new Set(); });

    const SVG_EL = document.getElementById('wheel');
    const NS = 'http://www.w3.org/2000/svg';
    const N = DATA.length;
    const STEP = (2 * Math.PI) / N;
    const START = -Math.PI / 2;
    const R_IN = 52;
    const R_OUT = 162;
    const GAP = 0.028;
    let active = -1;

    function polar(r, a) { return [r * Math.cos(a), r * Math.sin(a)]; }

    function arcPath(r1, r2, a1, a2) {
      const [sx1, sy1] = polar(r1, a1 + GAP);
      const [ex1, ey1] = polar(r1, a2 - GAP);
      const [sx2, sy2] = polar(r2, a1 + GAP);
      const [ex2, ey2] = polar(r2, a2 - GAP);
      const lg = (a2 - a1) > Math.PI ? 1 : 0;
      return `M${sx1},${sy1}L${sx2},${sy2}A${r2},${r2} 0 ${lg} 1 ${ex2},${ey2}L${ex1},${ey1}A${r1},${r1} 0 ${lg} 0 ${sx1},${sy1}Z`;
    }

    function svgEl(tag, attrs) {
      const e = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
      return e;
    }

    function drawLines(g, lines, cx, cy, midAngle, fs) {
      let rot = midAngle * 180 / Math.PI;
      if (Math.cos(midAngle) < 0) rot += 180;
      const lh = fs * 1.3;
      lines.forEach((line, i) => {
        const dy = (i - (lines.length - 1) / 2) * lh;
        const t = svgEl('text', {
          x: 0, y: 0,
          'text-anchor': 'middle',
          'dominant-baseline': 'central',
          fill: 'rgba(255,255,255,0.92)',
          'font-size': fs,
          'font-weight': 'bold',
          'pointer-events': 'none',
          'font-family': "'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif",
          transform: `translate(${cx},${cy}) rotate(${rot}) translate(0,${dy})`
        });
        t.textContent = line;
        g.appendChild(t);
      });
    }

    function render() {
      while (SVG_EL.firstChild) SVG_EL.removeChild(SVG_EL.firstChild);

      // Filter defs for glow
      const defs = svgEl('defs', {});
      const filt = svgEl('filter', { id: 'glow', x: '-25%', y: '-25%', width: '150%', height: '150%' });
      const fg = svgEl('feGaussianBlur', { stdDeviation: '4', result: 'blur' });
      const fm = svgEl('feMerge', {});
      fm.appendChild(svgEl('feMergeNode', { in: 'blur' }));
      fm.appendChild(svgEl('feMergeNode', { in: 'SourceGraphic' }));
      filt.appendChild(fg); filt.appendChild(fm);
      defs.appendChild(filt);
      SVG_EL.appendChild(defs);

      SVG_EL.appendChild(svgEl('circle', { cx: 0, cy: 0, r: R_OUT + 10, fill: '#0a0300' }));

      DATA.forEach((cat, i) => {
        const a1 = START + i * STEP;
        const a2 = START + (i + 1) * STEP;
        const mid = (a1 + a2) / 2;
        const isActive = i === active;
        const isDimmed = active >= 0 && !isActive;

        const rOut = isActive ? R_OUT + 22 : R_OUT;
        const rIn  = isActive ? R_IN  -  7 : R_IN;

        const g = svgEl('g', { style: `cursor:pointer;transition:opacity 0.2s;opacity:${isDimmed ? 0.28 : 1}` });

        const pathEl = svgEl('path', {
          d: arcPath(rIn, rOut, a1, a2),
          fill: isActive ? cat.bright : cat.color,
          stroke: '#0a0300',
          'stroke-width': '2.5',
        });
        if (isActive) pathEl.setAttribute('filter', 'url(#glow)');
        g.appendChild(pathEl);

        // Dot badge showing how many tags are selected in this category
        if (cat.sel.size > 0) {
          const [dx, dy] = polar(R_OUT - 12, mid);
          g.appendChild(svgEl('circle', { cx: dx, cy: dy, r: 6, fill: '#fff', opacity: '0.9' }));
          const dt = svgEl('text', {
            x: dx, y: dy,
            'text-anchor': 'middle', 'dominant-baseline': 'central',
            fill: '#1a0a00', 'font-size': '7', 'font-weight': 'bold', 'pointer-events': 'none'
          });
          dt.textContent = cat.sel.size > 9 ? '9+' : String(cat.sel.size);
          g.appendChild(dt);
        }

        const textR = (rIn + rOut) / 2;
        const [tx, ty] = polar(textR, mid);
        const lines = cat.name.split('\n');
        drawLines(g, lines, tx, ty, mid, lines.length > 1 ? 8.5 : 10.5);

        g.addEventListener('click', () => {
          active = active === i ? -1 : i;
          render();
          updatePanel();
        });
        SVG_EL.appendChild(g);
      });

      // Center
      const cg = svgEl('g', {});
      cg.appendChild(svgEl('circle', {
        cx: 0, cy: 0, r: R_IN - 6,
        fill: '#2a0e00', stroke: '#c8a56a', 'stroke-width': '1.5'
      }));
      for (const [txt, y, fs] of [['☕', -10, 18], ['FLAVOR', 6, 7], ['WHEEL', 16, 7]]) {
        const t = svgEl('text', { x: 0, y, 'text-anchor': 'middle', fill: '#c8a56a', 'font-size': fs, 'pointer-events': 'none' });
        t.textContent = txt;
        cg.appendChild(t);
      }
      SVG_EL.appendChild(cg);
    }

    function updatePanel() {
      const title   = document.getElementById('panel-title');
      const body    = document.getElementById('panel-body');
      const notesSec = document.getElementById('notes-section');
      const notesList = document.getElementById('notes-list');

      if (active < 0) {
        title.textContent = 'カテゴリーを選択';
        title.style.color = '#c8a56a';
        body.innerHTML = '<p id="empty-msg">ホイールのセグメントをクリックすると、詳細なフレーバーノートが表示されます。<br><br>タグをクリックしてテイスティングノートを記録できます。</p>';
      } else {
        const cat = DATA[active];
        title.textContent = cat.name.replace('\n', ' ');
        title.style.color = cat.bright;

        body.innerHTML = cat.sub.map(s => `
          <div class="subcat">
            <div class="subcat-label">${s.name}</div>
            <div class="tags">${s.tags.map(t => {
              const cls = cat.sel.has(t) ? ' on' : '';
              return `<span class="tag${cls}" data-tag="${t}" onclick="toggleTag(this)">${t}</span>`;
            }).join('')}</div>
          </div>
        `).join('');
      }

      const allNotes = DATA.flatMap(cat => [...cat.sel]);
      if (allNotes.length > 0) {
        notesSec.style.display = 'flex';
        notesList.innerHTML = allNotes.map(n => `<span class="note-chip">${n}</span>`).join('');
      } else {
        notesSec.style.display = 'none';
      }
    }

    window.toggleTag = function(el) {
      if (active < 0) return;
      const tag = el.dataset.tag;
      const cat = DATA[active];
      if (cat.sel.has(tag)) { cat.sel.delete(tag); el.classList.remove('on'); }
      else                  { cat.sel.add(tag);    el.classList.add('on');    }
      updatePanel();
      render();
    };

    window.clearAll = function() {
      DATA.forEach(cat => cat.sel.clear());
      updatePanel();
      render();
    };

    render();
    updatePanel();
  </script>
</body>
</html>
